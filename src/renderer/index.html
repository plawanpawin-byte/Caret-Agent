<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caret Agent</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar" id="titlebar"></header>
  <div id="root">
    <!-- Studio: IDE layout -->
    <div class="layout" id="studio">
      <nav class="activity" id="activity"></nav>
      <aside class="sidebar col" id="sidebar"></aside>
      <div class="resizer" data-resize="sidebar"></div>
      <main class="center col">
        <div class="col" style="flex:1" id="editor-area"></div>
        <div class="resizer h" data-resize="bottom"></div>
        <section class="bottom col" id="bottom"></section>
      </main>
      <div class="resizer" data-resize="chatpane"></div>
      <aside class="chatpane col" id="chatpane"></aside>
    </div>
    <!-- Agent: chat-first layout -->
    <div class="layout hidden" id="agentview">
      <aside class="sessions col" id="sessions"></aside>
      <main class="agent-center col" id="agent-center"></main>
      <aside class="filespane col" id="filespane"></aside>
    </div>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
  <script src="monaco/vs/loader.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
